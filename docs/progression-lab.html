<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물 수호대 · 성장 검수실</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/game/rewards.css"><link rel="stylesheet" href="../src/game/frontier.css"><style>
.lab-tools{position:fixed;inset:12px 12px auto;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#20372ded;padding:12px;border:1px solid #91a07a;font-size:11px}.lab-tools button{padding:8px}.lab-tools a{color:#e6cea0}.lab-note{position:fixed;bottom:12px;left:16px;right:16px;font-size:10px;line-height:1.8;color:#f3e7c7;text-shadow:1px 2px #182d23;pointer-events:none}.lab-tools output{width:100%;font-size:10px}#map{display:none}#overlay .dialog{max-height:calc(100dvh - 170px);margin-top:60px}@media(max-width:600px){.lab-tools{font-size:9px;gap:5px;padding:8px}.lab-tools button{padding:7px;font-size:9px}#overlay .dialog{max-height:calc(100dvh - 225px);margin-top:85px}.lab-note{font-size:9px}}
</style></head><body><canvas id="world" aria-label="고정 성장 전투 실험"></canvas><canvas id="map" width="164" height="130"></canvas><div class="lab-tools"><b>성장 검수실 · 무적 고정 실험</b><button data-mode="pip">다람쥐 숙련</button><button data-mode="bram">고슴도치 숙련</button><button data-mode="returning">왕복 산탄 공방</button><button data-mode="hive">벌떼 공방</button><button data-mode="boss">합체 최종전</button><button data-mode="checkpoint">보스 전리품</button><button id="freeze">정지</button><a href="../index.html">게임으로</a><output id="proof"></output></div><main id="overlay"></main><div class="lab-note">성장·진화·합체 화면을 빠르게 확인하는 고정 실험입니다. 일반 원정과 같은 모델·UI를 사용하지만 재료와 적을 미리 배치하며 기록을 저장하지 않습니다. WASD 이동 · E 고유기 · SPACE 구르기</div><script type="module">
import {createFrontierExpedition,updateExpedition} from '../src/game/expedition.js';
import {stepGame,spawnEnemy,applyChoice,openForge,selectChest,closeChest,claimBossReward,continueCampaign,xpCost,deriveStats} from '../src/core/game.js';
import {recordHunt,challengeFrontier,finishFrontier} from '../src/core/frontier.js';
import {unlockMastery,branchChoices} from '../src/core/mastery.js';
import {branchView,forgeView,bossRewardView} from '../src/game/frontier-ui.js';
import {loadIllustratedArt} from '../src/art/illustrated.js';
import {createRenderer} from '../src/game/render.js';
const $=id=>document.getElementById(id),art=await loadIllustratedArt(),renderer=createRenderer($('world'),$('map'),art),keys=new Set();let g,last=performance.now(),phase='',frozen=false;
function checkpoint(){g.time=100;for(let i=0;i<g.campaign.target;i++)recordHunt(g,{type:'shroom'},xpCost);challengeFrontier(g,(...args)=>spawnEnemy(g,...args));const e=g.enemies.find(e=>e.bossRole);g.enemies=[];g.time=125;finishFrontier(g,e);}
function reset(mode){phase='';frozen=false;keys.clear();g=createFrontierExpedition(['bram','hive'].includes(mode)?'bram':'pip');g.enemies=[];g.pickups=[];g.terrain=[];g.player.x=0;g.player.y=120;g.player.invincible=1000;g.player.charge=100;g.spawn=g.nextElite=g.campaign.nextHordeAt=1e6;
 if(['pip','bram'].includes(mode)){g.level=10;g.mastery.points=140;unlockMastery(g);g.choices=branchChoices(g);g.choiceMode='mastery';g.phase='choice';}
 if(['returning','hive','checkpoint','boss'].includes(mode)){checkpoint();if(mode!=='checkpoint')claimBossReward(g,'heal');}
 if(['returning','hive'].includes(mode)){g.level=18;g.weapons=mode==='returning'?{acorn:{rank:8,evolved:false,clock:0,branch:'focus'},moon:{rank:8,evolved:false,clock:0,branch:'spread'}}:{briar:{rank:8,evolved:false,clock:0,branch:'counter'},bees:{rank:8,evolved:false,clock:0,branch:'guard'}};g.passives={twin:1,feather:1,leaf:1,dew:1};g.stats=deriveStats(g);openForge(g);}
 if(mode==='boss'){continueCampaign(g,'frontier');g.level=24;g.weapons={returning:{rank:1,evolved:true,clock:0,branch:'focus',core:'acorn'}};g.unions=['returning'];g.evolutions=['acorn'];g.passives={twin:2,feather:3};g.stats=deriveStats(g);for(let i=0;i<g.campaign.target;i++)recordHunt(g,{type:'shroom'},xpCost);challengeFrontier(g,(...args)=>spawnEnemy(g,...args));g.mastery.points=300;g.mastery.tier=3;g.mastery.branch='focus';}
 if(mode!=='boss'&&mode!=='checkpoint')for(let i=0;i<180;i++){const a=i*Math.PI*2/180,r=155+i%6*35;spawnEnemy(g,'shroom',Math.cos(a)*r,120+Math.sin(a)*r,{hp:95,maxHp:95,xp:0,speed:28,damage:1});}sync();}
function sync(){if(g.phase===phase)return;phase=g.phase;$('overlay').innerHTML='';const view=g.phase==='choice'?branchView(g):g.phase==='chest'?forgeView(g):g.phase==='crossroads'?bossRewardView(g):null;if(!view)return;const [title,eyebrow,body,actions]=view;$('overlay').innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span class="eyebrow">${eyebrow}</span><h2 id="dialog-title">${title}</h2>${body}<div class="dialog-actions">${actions}</div></section></div>`;
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{applyChoice(g,Number(b.dataset.choice));phase='';sync();});document.querySelectorAll('[data-evolve]').forEach(b=>b.onclick=()=>{selectChest(g,b.dataset.evolve);phase='';sync();});if($('close-chest'))$('close-chest').onclick=()=>{closeChest(g);phase='';sync();};document.querySelectorAll('[data-boss-reward]').forEach(b=>b.onclick=()=>{claimBossReward(g,b.dataset.bossReward);phase='';sync();});if($('forge'))$('forge').onclick=()=>{openForge(g);phase='';sync();};document.querySelectorAll('[data-continue]').forEach(b=>b.onclick=()=>{continueCampaign(g,'frontier');phase='';sync();});document.querySelector('.choice,.primary')?.focus();}
for(const b of document.querySelectorAll('[data-mode]'))b.onclick=()=>reset(b.dataset.mode);$('freeze').onclick=()=>{frozen=!frozen;$('freeze').textContent=frozen?'재생':'정지';};document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space')e.preventDefault();if(g.phase==='choice'&&['1','2'].includes(e.key)){applyChoice(g,Number(e.key)-1);phase='';sync();}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const begin=performance.now();if(!frozen&&g.phase==='playing'){stepGame(g,dt,{x:Number(keys.has('d'))-Number(keys.has('a')),y:Number(keys.has('s'))-Number(keys.has('w')),skill:keys.has('e'),dash:keys.has(' ')});updateExpedition(g);g.events=[];}sync();renderer.render(g,dt);$('proof').textContent=`${g.phase} · ${g.kills}처치 · 적 ${g.enemies.length} · 숙련 ${g.mastery?.tier||0} · 인장 ${g.campaign.seals} · 프레임 작업 ${(performance.now()-begin).toFixed(1)}ms`;requestAnimationFrame(frame);}reset('pip');requestAnimationFrame(frame);
</script></body></html>
