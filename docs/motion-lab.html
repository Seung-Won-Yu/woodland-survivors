<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>원화 기반 전투 모션 검수</title><style>@font-face{font-family:G;src:url('../fonts/woodland/Galmuri11.woff2')}*{box-sizing:border-box}body{margin:0;padding:26px;background:#304433;color:#eddfb4;font:12px G,monospace}h1{font-size:23px;font-weight:400}p{color:#c5ccaa;line-height:1.9}canvas{max-width:100%;background:#6b7951;border:1px solid #96a478}button,select,a{font:inherit;color:#e7d7ad;background:#3b543b;border:1px solid #8c9c70;padding:10px 16px;margin:8px 8px 14px 0;text-decoration:none;display:inline-block}label{margin-right:12px}#proof{font-size:11px;max-width:960px;white-space:pre-line}h2{font-size:16px;font-weight:400;margin-top:28px}#atlas{display:none}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}</style></head><body><h1>동물 수호대 · 원화 기반 전투 모션</h1><p>실제 전투에서 사용하는 대원·프레임입니다. 원화의 털, 꼬리, 장비와 팔레트를 유지합니다.<br>좌우 보행 8포즈 / 정면·후면 보행 4포즈 / 방향별 공격 준비·발사·복귀·피격. 좌향은 우향의 반전입니다.</p><div class="controls"><label for="motion">확인할 동작</label><select id="motion"><option value="walk">걷기</option><option value="attack">정지 후 공격</option><option value="movingAttack">걸으면서 공격</option><option value="strafe">이동·조준 방향 분리</option><option value="hurt">피격</option></select><button id="pause">정지</button><a id="download" download="woodland-illustrated-atlas.png">실사용 아틀라스 저장</a><a id="preview-download" download="woodland-motion-preview.png">미리보기 저장</a></div><canvas id="preview" width="960" height="530"></canvas><p id="proof">자산을 불러오는 중…</p><div id="atlas"></div><script type="module">
import {loadIllustratedArt} from '../src/art/illustrated.js';
import {drawHero} from '../src/art/sprites.js';
import {HEROES} from '../src/core/content.js';
import {animationState} from '../src/game/motion.js';
const art=await loadIllustratedArt(),atlas=art.atlas,cell=atlas.spriteCell,source=atlas.getContext('2d');atlas.id='sprite-atlas';document.querySelector('#atlas').append(atlas);document.querySelector('#download').href=atlas.toDataURL();
const errors=[],lines=[];for(let h=0;h<6;h++)for(let d=0;d<4;d++){const hashes=[];for(let f=0;f<8;f++){const data=source.getImageData(f*cell,(h*4+d)*cell,cell,cell).data;let hash=2166136261;for(const b of data)hash=Math.imul(hash^b,16777619)>>>0;hashes.push(hash);}const n=new Set(hashes).size,expected=[4,8,4,8][d];lines.push(`${Object.values(HEROES)[h].name} ${['정면','우측','후면','좌측'][d]} ${n}/${expected}`);if(n!==expected)errors.push(lines.at(-1));}
document.querySelector('#proof').textContent=`보행 프레임 검사 ${24-errors.length}/24 방향 조합 통과\n`+lines.join(' · ');document.querySelector('#proof').dataset.pass=String(errors.length===0);
let frozen=false,last=performance.now(),time=0;document.querySelector('#pause').onclick=()=>{frozen=!frozen;document.querySelector('#pause').textContent=frozen?'재생':'정지';};
const target=document.querySelector('#preview');document.querySelector('#preview-download').onclick=()=>{document.querySelector('#preview-download').href=target.toDataURL();};const c=target.getContext('2d'),ground=c.createPattern(art.textures.dirt,'repeat');
function frame(now){if(!frozen)time+=Math.min(40,now-last);last=now;c.fillStyle=ground;c.fillRect(0,0,960,530);c.fillStyle='#6b75575c';c.fillRect(0,0,960,530);c.imageSmoothingEnabled=true;c.font='12px G,monospace';c.textAlign='center';const motion=document.querySelector('#motion').value;
for(let h=0;h<6;h++){c.fillStyle='#f0e3b9';c.fillText(Object.values(HEROES)[h].name,80+h*160,27);for(let d=0;d<4;d++){
 const x=80+h*160,y=145+d*120,phase=time%720,moving=['walk','movingAttack','strafe'].includes(motion),attacking=['attack','movingAttack','strafe'].includes(motion);
 const p={moving,fx:[0,1,0,-1][d],fy:[1,0,-1,0][d],aim:motion==='strafe'?0:[Math.PI/2,0,-Math.PI/2,Math.PI][d],walk:time*.192,attack:attacking&&phase>=80&&phase<320?.24-(phase-80)/1000:0,attackWindup:attacking&&phase<80?.08-phase/1000:0,hurt:motion==='hurt'&&phase<160?.3:0};
 const pose=animationState(p);c.fillStyle='#354b3b80';c.beginPath();c.ellipse(x,y+2,19,6,0,0,Math.PI*2);c.fill();c.fillStyle='#a0ac7c';c.fillRect(x-46,y+7,92,1);
 drawHero(c,atlas,h,pose.dir,pose.frame,x,y,160,pose.legFrame,{x:p.attack>.15?-Math.cos(p.aim)*2:0,y:0},pose.legDir);
}}
requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
