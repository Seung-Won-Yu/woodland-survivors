<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>전투 모션 검수</title><style>@font-face{font-family:G;src:url('/fonts/woodland/Galmuri11.woff2')}*{box-sizing:border-box}body{margin:0;padding:30px;background:#293f32;color:#e5d8b0;font:12px G,monospace}h1{font-size:23px;font-weight:400}p{color:#b9c4a4;line-height:1.8}canvas{image-rendering:pixelated;max-width:100%;background:#526349;border:1px solid #7c8c65}a{display:inline-block;color:#283c2e;background:#d0b77c;padding:12px 20px;text-decoration:none;margin:10px 0}#proof{white-space:pre-line;font-size:11px}h2{font-size:16px;font-weight:400;margin-top:28px}</style></head><body><h1>동물 수호대 · 전투 모션 검수</h1><p>80px 셀 / 고정 발 피벗 (40, 70) / 보행 8프레임 / 4방향<br>상단은 이동 거리에 맞춘 걷기, 하단은 실제 생성된 전체 프레임입니다.</p><canvas id="preview" width="960" height="440"></canvas><p id="proof"></p><a id="download" download="woodland-combat-atlas.png">전투 아틀라스 PNG 저장</a><h2>전체 셀 · 6대원 × 4방향 × 12프레임</h2><p>각 행의 0–7: 보행 / 8: 대기 / 9–10: 공격 / 11: 피격. 실제 전투에서는 보행 하체와 공격 상체를 합성합니다.</p><div id="atlas"></div><script type="module">
import {createSprites,drawHero} from '/src/art/sprites.js';
import {HEROES} from '/src/core/content.js';
const atlas=createSprites(),ctx=atlas.getContext('2d');atlas.id='sprite-atlas';document.querySelector('#atlas').append(atlas);document.querySelector('#download').href=atlas.toDataURL();
const lines=[],errors=[];for(let h=0;h<6;h++)for(let d=0;d<4;d++){const hashes=[];for(let f=0;f<8;f++){const bytes=ctx.getImageData(f*80,(h*4+d)*80,80,80).data;let hash=2166136261;for(const b of bytes)hash=Math.imul(hash^b,16777619)>>>0;hashes.push(hash);}const n=new Set(hashes).size;lines.push(`${Object.values(HEROES)[h].name} ${['남','동','북','서'][d]}: ${n}/8`);if(n!==8)errors.push(lines.at(-1));}
document.querySelector('#proof').textContent=`보행 셀 검증: ${24-errors.length}/24 방향에서 8개 포즈가 모두 다름\n`+lines.join(' · ');document.querySelector('#proof').dataset.pass=String(errors.length===0);
const c=document.querySelector('#preview').getContext('2d');function frame(t){c.fillStyle='#526349';c.fillRect(0,0,960,440);c.imageSmoothingEnabled=false;c.font='12px G,monospace';c.textAlign='center';c.fillStyle='#e6d9ad';for(let h=0;h<6;h++){c.fillStyle='#e6d9ad';c.fillText(Object.values(HEROES)[h].name,80+h*160,25);for(let d=0;d<4;d++){const y=116+d*98,step=Math.floor(t/105)%8;c.fillStyle='#344e3c';c.fillRect(22+h*160,y-3,116,3);drawHero(c,atlas,h,['south','east','north','west'][d],step,80+h*160,y,88);}}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
