<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동물 수호대 · 전투 검수실</title><link rel="icon" href="../favicon.svg"><link rel="stylesheet" href="../src/style.css"><link rel="stylesheet" href="../src/game/rewards.css"><style>
.lab-bar{position:fixed;top:12px;left:12px;right:12px;z-index:4;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#243c30f0;border:1px solid #87976b;padding:10px 14px;font-size:10px}.lab-bar b{font-weight:400;color:#e8ce92}.lab-bar button,.lab-bar select{padding:7px;background:#3a513b;color:#e4d6af;border:1px solid #85956b;font:inherit}.lab-bar output{font-size:9px;color:#c4cda9}.lab-bar a{color:#ddca96}.lab-note{position:fixed;bottom:14px;left:18px;right:18px;font-size:9px;color:#e4dab4;text-shadow:1px 2px #24392a;pointer-events:none}#map{display:none}#overlay .dialog{max-height:calc(100dvh - 150px)}@media(max-width:600px){.lab-bar{gap:6px;padding:9px}.lab-bar b{width:100%}.lab-bar output{width:100%;line-height:1.7}.lab-note{font-size:8px;line-height:1.8}.lab-bar button,.lab-bar select{font-size:8px;padding:6px}#overlay .dialog{max-height:calc(100dvh - 190px);margin-top:50px}}
</style></head><body><canvas id="world" aria-label="고정 전투 실험"></canvas><canvas id="map" width="164" height="130"></canvas><div class="lab-bar"><b>전투 검수실 · 고정 실험</b><select id="weapon" aria-label="실험 무기"><option value="acorn">도토리</option><option value="moon">반달</option><option value="bees">벌떼</option><option value="storm">번개</option><option value="briar">가시</option><option value="vine">덩굴</option><option value="bloom">꽃</option><option value="lantern">등불</option></select><button id="opening">1단계 무기 / 군락</button><button id="awakened">각성 무기 / 군락</button><button id="midpoint">수문장</button><button id="final">버섯왕</button><button id="relic">유물 안내</button><button id="armory">정비 합체</button><button id="returning">왕복 산탄</button><button id="hive">벌떼 합체</button><button id="freeze">정지</button><a href="../index.html">게임으로</a><output id="proof" aria-live="off"></output></div><div id="rampage" hidden aria-hidden="true"><b></b><span></span><i></i></div><main id="overlay"></main><div class="lab-note">비교용으로 적·무기·시간을 고정합니다. 실제 게임과 같은 전투 모델·그림·유물 카드를 사용하며 원정 기록은 저장하지 않습니다. WASD 이동 · E 고유기 · SPACE 구르기</div><script type="module">
import {createCampaignExpedition,updateExpedition} from '../src/game/expedition.js';
import {stepGame,spawnEnemy,continueCampaign,openChest,selectChest,closeChest} from '../src/core/game.js';
import {createRenderer} from '../src/game/render.js';
import {loadIllustratedArt} from '../src/art/illustrated.js';
import {createRelicCache,openRelicCache,equipRelic,leaveRelicCache} from '../src/core/relics.js';
import {relicChoicesBody,chestView} from '../src/game/reward-ui.js';
import {updateCampaign} from '../src/core/campaign.js';
const $=id=>document.getElementById(id),art=await loadIllustratedArt(),renderer=createRenderer($('world'),$('map'),art),keys=new Set();let g,last=performance.now(),frozen=false,lastPhase='',mode='awakened';
function reset(kind){mode=kind;lastPhase='';frozen=false;$('freeze').textContent='정지';keys.clear();g=createCampaignExpedition('pip',$('weapon').value,1437);g.enemies=[];g.spawn=g.nextSurge=g.nextElite=1e6;g.player.x=0;g.player.y=100;g.pickups=[];
 if(['opening','awakened','relic','armory','returning','hive'].includes(kind)){g.weapons[g.startWeapon]={rank:kind==='opening'?1:8,evolved:kind!=='opening',clock:0};for(let i=0;i<120;i++){const a=i*Math.PI*2/120,r=155+(i%5)*38;spawnEnemy(g,'shroom',Math.cos(a)*r,100+Math.sin(a)*r,{hp:75,maxHp:75,xp:0,speed:25,damage:1});}}
 if(kind==='midpoint'||kind==='final'){g.time=kind==='midpoint'?180:420;g.weapons[g.startWeapon]={rank:8,evolved:kind==='final',clock:0};if(kind==='final'){g.campaign.mid={state:'defeated',id:null,spawnedAt:180,defeatedAt:210};g.campaign.midpointClaimed=true;g.campaign.armoryDropped=g.campaign.armoryClaimed=true;}updateCampaign(g,(...args)=>spawnEnemy(g,...args));}
 if(kind==='returning'||kind==='hive'){g.weapons={[kind]:{rank:1,evolved:true,clock:0}};}
 if(kind==='armory'){g.time=300;g.campaign.mid={state:'defeated',id:null,spawnedAt:180,defeatedAt:210};g.campaign.midpointClaimed=true;g.campaign.armoryDropped=true;g.weapons={acorn:{rank:8,evolved:true,clock:0},moon:{rank:3,evolved:false,clock:0}};openChest(g,{source:'armory',canEvolve:true});}
 if(kind==='relic'){g.weapons.bees={rank:8,evolved:true,clock:0};const cache=createRelicCache(g,'supply',0,100);cache.deck=['thread','shell','wind','thorn','seed','tide'];openRelicCache(g,cache);}
 sync();}
function sync(){if(g.phase===lastPhase)return;lastPhase=g.phase;$('overlay').innerHTML='';if(g.phase==='relic'){$('overlay').innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span class="eyebrow">유물 발견 · 0 / 2칸 장착</span><h2 id="dialog-title">숲이 건넨 두 가지 힘</h2>${relicChoicesBody(g)}<div class="dialog-actions"><button class="quiet" id="leave">지금은 남겨두기 →</button><span class="eyebrow">1 · 2 선택</span></div></section></div>`;document.querySelectorAll('[data-relic]').forEach(b=>b.onclick=()=>{equipRelic(g,b.dataset.relic);sync();});$('leave').onclick=()=>{leaveRelicCache(g);sync();};$('overlay').querySelector('[data-relic]')?.focus();}
 if(g.phase==='chest'){const [title,eyebrow,body,actions]=chestView(g);$('overlay').innerHTML=`<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span class="eyebrow">${eyebrow}</span><h2 id="dialog-title">${title}</h2>${body}${actions?`<div class="dialog-actions">${actions}</div>`:''}</section></div>`;document.querySelectorAll('[data-evolve]').forEach(b=>b.onclick=()=>{selectChest(g,b.dataset.evolve);lastPhase='';sync();});if($('close-chest'))$('close-chest').onclick=()=>{closeChest(g);sync();};}
 if(g.phase==='crossroads'){$('overlay').innerHTML='<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><span class="eyebrow">검수실 · 기록 저장 없음</span><h2 id="dialog-title">보스 격파 · 다음 공세</h2><p>현재 빌드로 이어갑니다. 실제 캠페인에서는 세 가지 전리품 중 하나를 고릅니다.</p><button class="primary" id="next">힘을 골라 다음 단계 →</button></section></div>';$('next').onclick=()=>{continueCampaign(g,'force');sync();};}}
for(const id of ['opening','awakened','midpoint','final','relic','armory','returning','hive'])$(id).onclick=()=>reset(id);$('weapon').onchange=()=>reset(mode);$('freeze').onclick=()=>{frozen=!frozen;$('freeze').textContent=frozen?'재생':'정지';};document.addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.code==='Space')e.preventDefault();if(g.phase==='relic'&&['1','2'].includes(e.key)){equipRelic(g,g.relicOffer.options[Number(e.key)-1]);sync();}});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;const begin=performance.now();if(!frozen&&g.phase==='playing'){stepGame(g,dt,{x:Number(keys.has('d'))-Number(keys.has('a')),y:Number(keys.has('s'))-Number(keys.has('w')),skill:keys.has('e'),dash:keys.has(' ')});updateExpedition(g);g.events=[];}sync();renderer.render(g,dt);const streak=g.time<=(g.feedback.streakUntil||0)?g.feedback.streak||0:0;$('rampage').hidden=streak<8;$('rampage').querySelector('b').textContent=`${streak} 연속`;$('rampage').querySelector('span').textContent='몰아치는 연격';$('rampage').querySelector('i').style.transform=`scaleX(${Math.max(0,((g.feedback.streakUntil||0)-g.time)/2)})`;$('proof').textContent=`${g.phase} · ${g.time.toFixed(1)}초 · ${g.kills}처치 · 적 ${g.enemies.length} · 피해 ${Math.round(g.damage)} · 프레임 작업 ${(performance.now()-begin).toFixed(1)}ms`;requestAnimationFrame(frame);}reset('awakened');requestAnimationFrame(frame);
</script></body></html>
