<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14212a"><title>작전 RIFT · 항구 돌파</title><link rel="icon" href="./mission-icon.svg"><link rel="preload" as="image" type="image/webp" fetchpriority="high" href="./art/mission/hangar-v014.webp"><link rel="preload" as="image" type="image/webp" href="./art/mission/fio-hangar-v033.webp"><link rel="stylesheet" href="./src/reboot/style.css"></head>
<body data-scene="lobby"><canvas id="world" aria-label="피오의 빌드 서바이버 전투"></canvas>
<div id="hud" hidden><div id="operation-track"></div>
 <section class="vitals"><div><strong id="operator-name">FIO</strong><b id="level">LV.1</b></div><div class="hp-track"><i id="hp-fill"></i><span id="hp">100 / 100</span></div><small id="charge">전탄 보급 60%</small></section>
 <section class="score"><b id="kills">0 K.O.</b><span id="score">0점</span><span id="time">0:00</span><button id="pause" aria-label="일시정지">Ⅱ</button></section>
 <div class="field-stack">
  <section class="objective" aria-label="현장 목표">
   <span id="stage">해안 침투</span><b id="objective">노획한 총으로 수송대를 차단하라</b><small id="threat">경계 0</small><small id="field-intel" hidden></small>
   <div id="holdout-intel" hidden>
    <div id="holdout-steps" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="holdout-readout"><span>바닥 XP</span><strong id="ground-xp">0</strong><span>게이트 개방</span></div>
    <b id="pursuit-goal"></b><small id="pursuit-intel"></small><small id="pursuit-pay"></small>
    <button id="pursuit" hidden><span id="pursuit-label"></span><kbd>Q</kbd></button>
   </div>
  </section>
 <aside id="map-panel"><span>전장 · 보급 / 보스</span><svg id="tactical-map" viewBox="0 0 1600 1200" role="img" aria-label="전장 지도: 흰색 대원, 금색 보급, 보라색 무기고, 주황색 적"></svg></aside>
 </div>
 <section id="raid-hud" hidden><div><b id="raid-hp"></b><span id="raid-time"></span></div><progress aria-label="수송대 남은 내구" id="raid-progress" max="1" value="0"></progress><small id="raid-angle"></small></section>
 <section id="boss-hud" hidden><span id="boss-state"></span><progress aria-label="보스 남은 내구" id="boss-hp" max="6000" value="6000"></progress><small id="boss-parts"></small><small id="boss-tactic" hidden></small><small id="boss-support" hidden></small></section>
 <section class="arsenal"><div id="weapons"></div><div id="modules"></div><small id="synergy"></small><small id="maneuver-status" hidden></small><small id="support-status" hidden></small><div class="field-workbench"><button id="gear">조율권 1 · 장비 G</button><button id="field-upgrade" aria-keyshortcuts="R" hidden><b>야전 개조</b><strong id="field-upgrade-count"></strong><kbd class="key-hint" aria-hidden="true">R</kbd></button></div></section>
 <div class="xp"><i id="xp-fill"></i></div><div id="combo"></div><div id="banner" aria-live="polite"></div>
</div>
<div id="controls" hidden><div id="stick" role="group" aria-label="이동 스틱"><i></i></div><div class="action-buttons"><button id="interact" hidden><span id="interact-label">상호작용</span><kbd>F</kbd></button><button id="dash">회피<small>SPACE</small></button><button id="skill">전탄 보급<small>E</small></button></div></div>
<main id="ui"><section class="sheet"><span class="eyebrow">OPERATION RIFT</span><h1>전장 준비 중</h1><p>병기와 전장을 불러오고 있습니다.</p></section></main>
<div id="field-feedback" hidden role="status"></div><div id="notice" role="status"></div><div id="save-status" aria-hidden="true">기록 중…</div><script type="module" src="./src/reboot/main.js"></script></body></html>
